name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Select stable Rust
        run: rustup default stable
      - run: cargo test --locked --all-targets
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select stable Rust
        run: rustup default stable
      - name: Install lint components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check POSIX installer syntax
        run: sh -n install.sh


  installer-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install latest release (POSIX)
        if: runner.os != 'Windows'
        env:
          CODEX_NOTIFY_INSTALL_DIR: ${{ runner.temp }}/codex-reset-notifier-bin
        run: |
          sh install.sh
          "${{ runner.temp }}/codex-reset-notifier-bin/codex-reset-notifier" --version
      - name: Install latest release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEX_NOTIFY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'codex-reset-notifier-bin'
          ./install.ps1
          & (Join-Path $env:CODEX_NOTIFY_INSTALL_DIR 'codex-reset-notifier.exe') --version
