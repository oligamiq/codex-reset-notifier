[package]
name = "codex-reset-notifier"
version = "0.1.0"
edition = "2024"
description = "Send phone notifications when Codex quota windows are exhausted or reset"
license = "MIT"
readme = "README.md"
repository = "https://github.com/oligamiq/codex-reset-notifier"
homepage = "https://github.com/oligamiq/codex-reset-notifier"
keywords = ["codex", "notifications", "ntfy", "quota", "openai"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
